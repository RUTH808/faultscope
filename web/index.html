<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FaultScope | Live demo</title><style>body{font:16px/1.6 Arial,sans-serif;max-width:980px;margin:45px auto;padding:0 24px;color:#171717}h1{font-size:42px;letter-spacing:-1px}textarea{display:block;width:100%;box-sizing:border-box;min-height:190px;font:14px/1.5 monospace;padding:18px;border:1px solid #aaa}button{font:inherit;background:#1f6f5f;color:white;border:0;padding:12px 22px;cursor:pointer;margin:15px 10px 15px 0}a{color:#1f6f5f}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f5f2;padding:20px}article{border-top:1px solid #d8d8d4;padding-top:15px;margin-top:20px}.note{color:#5e6462;font-size:14px}</style><body><p class="note">Local inference / reproducible portfolio</p><h1>FaultScope</h1><p>Classify 27 measured steel-fault features; low-confidence predictions require review.</p><p><a href="/report">Read the measured benchmark report</a></p><label for="request">JSON request</label><textarea id="request" spellcheck="false"></textarea><button id="example">Load example</button><button id="run">Run inference</button><p id="status" role="status"></p><div id="result"></div><p class="note">Runs locally. Model confidence is not a guarantee of correctness. The README documents evaluation scope.</p><script>const $=s=>document.querySelector(s);async function example(){let r=await fetch('/example');$('#request').value=JSON.stringify(await r.json(),null,2)}$('#example').onclick=example;$('#run').onclick=async()=>{let button=$('#run');button.disabled=true;$('#status').textContent='Running…';try{let payload=JSON.parse($('#request').value),t=performance.now();let r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),data=await r.json();$('#result').replaceChildren();if(!r.ok)throw Error(data.error);if(data.results){for(let item of data.results){let a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),meta=document.createElement('small');h.textContent=item.title;p.textContent=item.abstract;meta.textContent='Document '+item.id+' · fusion score '+item.score.toFixed(5);a.append(h,meta,p);$('#result').append(a)}}else{let pre=document.createElement('pre');pre.textContent=JSON.stringify(data,null,2);$('#result').append(pre)}$('#status').textContent='Completed in '+(performance.now()-t).toFixed(0)+' ms (includes HTTP).'}catch(e){$('#status').textContent=e.message}finally{button.disabled=false}};example();</script></body></html>
